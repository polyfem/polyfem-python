name: Release Packages

on:
  workflow_dispatch:

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.archive.outputs.filename }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Prepare source archive
        run: |
          python -m pip install build numpy
          python tools/generate_polyfem_api.py
          python -m build --sdist
          python tools/check_distribution.py "dist/*.tar.gz"
      - name: Locate source archive
        id: archive
        shell: python
        run: |
          import os
          from pathlib import Path
          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise RuntimeError(f"Expected one source archive, found {archives}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"filename={archives[0].name}\n")
      - uses: actions/upload-artifact@v7
        with:
          name: polyfempy-source
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: source
    runs-on: ${{ matrix.target.os }}
    name: Wheel / ${{ matrix.target.name }} / CPython ${{ matrix.python }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python: ["311"]
        target:
          - { name: windows-x64, os: windows-2022, arch: AMD64 }
          - { name: linux-x64, os: ubuntu-latest, arch: x86_64 }
          - { name: macos-intel, os: macos-15-intel, arch: x86_64 }
          - { name: macos-arm64, os: macos-15, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: polyfempy-source
          path: dist
      - name: Use short Windows build paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/pf-tmp | Out-Null
          "TEMP=C:/pf-tmp" >> $env:GITHUB_ENV
          "TMP=C:/pf-tmp" >> $env:GITHUB_ENV
          "CPM_SOURCE_CACHE=C:/pf-cpm" >> $env:GITHUB_ENV
      - name: Build and test installed wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: dist/${{ needs.source.outputs.filename }}
          config-file: cibuildwheel.toml
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python }}-*
          CIBW_ARCHS: ${{ matrix.target.arch }}
      - name: Check wheel contents
        run: python tools/check_distribution.py "wheelhouse/*.whl"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target.name }}-cp${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  conda:
    needs: source
    runs-on: ${{ matrix.target.os }}
    name: Conda / ${{ matrix.target.name }} / Python ${{ matrix.python }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
        target:
          - { name: win-64, os: windows-2022 }
          - { name: linux-64, os: ubuntu-latest }
          - { name: osx-64, os: macos-15-intel }
          - { name: osx-arm64, os: macos-15 }
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: polyfempy-source
          path: dist
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: package-build
          python-version: "3.13"
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
      - name: Install conda build tools
        run: conda install --yes --override-channels --channel conda-forge conda-build
      - name: Select the source archive
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise RuntimeError(f"Expected one source archive, found {archives}")
          archive = archives[0].resolve()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"POLYFEMPY_SDIST_URL={archive.as_uri()}\n")
              output.write(f"POLYFEMPY_SDIST_SHA256={hashlib.sha256(archive.read_bytes()).hexdigest()}\n")
              output.write(f"CPM_SOURCE_CACHE={Path(os.environ['RUNNER_TEMP']) / 'pf-cpm'}\n")
          PY
      - name: Use short Windows build paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/pf-tmp | Out-Null
          "TEMP=C:/pf-tmp" >> $env:GITHUB_ENV
          "TMP=C:/pf-tmp" >> $env:GITHUB_ENV
          "CONDA_BLD_PATH=C:/pf-cb" >> $env:GITHUB_ENV
          "CPM_SOURCE_CACHE=C:/pf-cpm" >> $env:GITHUB_ENV
      - name: Build and test the native conda package
        run: >-
          conda-build conda/recipe --python "${{ matrix.python }}"
          --no-anaconda-upload --override-channels --channel conda-forge
          --output-folder conda-out
      - uses: actions/upload-artifact@v7
        with:
          name: conda-${{ matrix.target.name }}-py${{ matrix.python }}
          path: |
            conda-out/**/*.conda
            conda-out/**/*.tar.bz2
          if-no-files-found: error
