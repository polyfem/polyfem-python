name: Generated Contact Backend

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      generated_source_tolerance:
        description: Numeric tolerance for generated vs source JSON metric comparison
        required: false
        default: "1e-5"
        type: string
      max_threads:
        description: Max backend threads per case
        required: false
        default: "1"
        type: string

env:
  GENERATED_SOURCE_TOLERANCE: ${{ github.event.inputs.generated_source_tolerance || '1e-5' }}
  MAX_THREADS: ${{ github.event.inputs.max_threads || '1' }}

jobs:
  generated-contact-backend:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       (github.event.action != 'edited' || github.event.changes.base != null))
    concurrency:
      group: forward-solver-${{ github.ref }}
      cancel-in-progress: true
    name: Forward solver checks (Ubuntu, Python 3.11)
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=77" wheel build cmake nanobind numpy pytest

      - name: Generate packaged API
        run: python tools/generate_polyfem_api.py

      - name: Build source archive and wheel
        # The default build creates the wheel from the unpacked source archive.
        run: python -m build --no-isolation

      - name: Check distribution contents
        run: python tools/check_distribution.py "dist/*.tar.gz" "dist/*.whl"

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-test/bin/python" tools/check_installed_package.py \
            --readme README.md --reference polyfem-data/units/neohookean.json \
            --example examples/quickstart/beam.py \
            --example examples/quickstart/static_elasticity.py \
            --example examples/quickstart/transient_elasticity.py

      - name: Install wheel for the full example sweep
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Upload checked distributions
        uses: actions/upload-artifact@v7
        with:
          name: polyfempy-ubuntu-py311
          retention-days: 14
          path: dist/*

      - name: Check compiled backend
        run: python -I -m polyfempy backend-info --require

      - name: Run active generated contact backend sweep
        run: |
          python tools/run_generated_contact_backend_checks.py \
            --output-root build/generated-contact-backend-check-release-candidate \
            --generated-source-tolerance "$GENERATED_SOURCE_TOLERANCE" \
            --max-threads "$MAX_THREADS" \
            --require-tests-match

      - name: Upload generated contact backend results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-contact-backend-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/generated-contact-backend-check-release-candidate/summary.txt
            build/generated-contact-backend-check-release-candidate/summary.json
            build/generated-contact-backend-check-release-candidate/logs
            tools/generated_contact_expected_failures.json
